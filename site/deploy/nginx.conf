worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 256;

    # ---- logging -----------------------------------------------------------
    #
    # The point of these logs is one question: how many people are interested,
    # and where did they hear about it. That does not require knowing who any
    # of them are, so this never writes a whole address to disk.
    #
    # Requests arrive from cloudflared, so $remote_addr is a docker-network
    # address and worthless either way. The real client address is in
    # CF-Connecting-IP, and it gets truncated before it is ever written:
    # IPv4 to its /24, IPv6 to its /48. Enough to tell two visitors apart on a
    # given day, not enough to point at a person or a household.

    map $http_cf_connecting_ip $client_prefix {
        default                                     "unknown";
        # IPv4 -> a.b.c.0
        "~^(?<a>\d+)\.(?<b>\d+)\.(?<c>\d+)\.\d+$"   "$a.$b.$c.0";
        # IPv6 -> first three groups
        "~^(?<g>[0-9a-fA-F]+:[0-9a-fA-F]*:[0-9a-fA-F]*):"  "$g::";
    }

    # Two ways a request can be ours rather than a visitor's, and both have to
    # be excluded or the numbers drift upward on their own.
    #
    # 1. No CF-Connecting-IP: it never went through cloudflared, so it is local
    #    — the deploy script curling nginx to check it is serving.
    # 2. X-ClickGraft-Check: healthcheck.sh, which fetches the whole zip to
    #    confirm the bytes on disk match the published hash. That is a real GET
    #    of the download and was counting as one every single deploy.
    #
    # The header is not a secret and anyone could send it to keep themselves out
    # of the log. That is a fair trade: hiding your own visit harms nobody, and
    # the alternative is a shared secret in a file for no security benefit.
    map $http_cf_connecting_ip $from_internet {
        ""      0;
        default 1;
    }
    map $http_x_clickgraft_check $not_self_check {
        ""      1;
        default 0;
    }
    map "$from_internet$not_self_check" $loggable {
        "11"    1;
        default 0;
    }

    # Query strings are dropped: campaign tags and referrer junk end up there
    # and none of it is worth keeping. $uri is the path after normalisation.
    # $server_protocol is already "HTTP/1.1" — don't prefix it again.
    log_format privacy '$client_prefix - - [$time_local] "$request_method $uri '
                       '$server_protocol" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" "$http_cf_ipcountry"';

    # NOT access.log: the nginx image ships /var/log/nginx/access.log as a
    # symlink to /dev/stdout, and a volume mounted over that directory inherits
    # the symlink. Writing there means writing to the container's stdout, so the
    # file GoAccess reads stays permanently empty. Distinct names avoid it.
    access_log /var/log/nginx/clickgraft-access.log privacy if=$loggable;
    error_log  /var/log/nginx/clickgraft-error.log warn;

    # ---- site --------------------------------------------------------------

    map $uri $cache_control {
        default            "no-cache";
        ~\.zip$            "public, max-age=300";
    }

    # One report every 10s per truncated prefix, bursting to 3. A person
    # pressing a button cannot exceed this; something automated will.
    limit_req_zone $client_prefix zone=reports:1m rate=6r/m;

    server {
        listen 80;
        listen [::]:80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        # The page is one self-contained file: no scripts, no external anything.
        # The policy says so, so a browser enforces it even if that ever slips.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Served as a download rather than whatever the browser guesses.
        location = /ClickGraft.zip {
            add_header Content-Disposition 'attachment; filename="ClickGraft.zip"' always;
            add_header Cache-Control "public, max-age=300" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
        }

        # Bug reports from the app. The user has read the exact text before
        # this is called; see sendReport() in packaging/ClickGraft.swift.
        location = /report {
            limit_req zone=reports burst=3 nodelay;
            client_max_body_size 256k;

            # Docker's embedded DNS, and the upstream held in a VARIABLE on
            # purpose. With a literal hostname nginx resolves it once at
            # startup, so if the collector is down or slow to appear, nginx
            # refuses to start and the whole site is gone — a static page
            # taken offline by an optional service it doesn't need. Through a
            # variable, resolution happens per request: the page always serves,
            # and only /report degrades to a 502.
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $collector "http://report:8080/report";
            proxy_pass $collector;

            proxy_set_header CF-IPCountry $http_cf_ipcountry;
            # No address is forwarded. The collector stores country only.
        }

        # The stats report must never be reachable from the internet. Belt and
        # braces: it is not under root anyway, and this refuses it by name.
        location ~ ^/(stats|goaccess) { return 404; }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
