<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClickGraft</title>
<style>
  :root{
    --ground:#FBFBFC; --panel:#FFF; --ink:#1B2024; --muted:#5C6670; --rule:#E2E6EA;
    --accent:#0F6E62; --accent-soft:#E6F1EF; --good:#0F6E62; --watch:#A66A00; --bad:#B3261E;
    --shadow:0 1px 2px rgba(27,32,36,.05),0 10px 30px -18px rgba(27,32,36,.35);
  }
  @media (prefers-color-scheme:dark){
    :root{--ground:#14171A;--panel:#1B1F23;--ink:#E8EBEE;--muted:#9AA4AE;--rule:#262B31;
      --accent:#5FBFAE;--accent-soft:#123029;--good:#5FBFAE;--watch:#D9A343;--bad:#E8877F;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.8);}
  }
  :root[data-theme=dark]{--ground:#14171A;--panel:#1B1F23;--ink:#E8EBEE;--muted:#9AA4AE;--rule:#262B31;
    --accent:#5FBFAE;--accent-soft:#123029;--good:#5FBFAE;--watch:#D9A343;--bad:#E8877F;}
  :root[data-theme=light]{--ground:#FBFBFC;--panel:#FFF;--ink:#1B2024;--muted:#5C6670;--rule:#E2E6EA;
    --accent:#0F6E62;--accent-soft:#E6F1EF;--good:#0F6E62;--watch:#A66A00;--bad:#B3261E;}

  *{box-sizing:border-box}
  body{margin:0;padding:40px 20px 72px;background:var(--ground);color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
  code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86em;
    font-variant-numeric:tabular-nums}

  h1{font-size:26px;margin:0;letter-spacing:-.02em}
  h2{font-size:17px;margin:0 0 4px;letter-spacing:-.01em}
  p{margin:0}
  .eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
    font-weight:600}
  .muted{color:var(--muted)}
  .small{font-size:13.5px}

  header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
    border-bottom:1px solid var(--rule);padding-bottom:16px}
  .steps{display:flex;gap:6px;flex-wrap:wrap}
  .pip{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--rule);
    color:var(--muted)}
  .pip.on{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}

  .card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:20px 22px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .spread{display:flex;justify-content:space-between;align-items:center;gap:12px}

  button{font:inherit;font-size:15px;font-weight:600;padding:10px 20px;border-radius:9px;
    border:1px solid var(--rule);background:var(--panel);color:var(--ink);cursor:pointer}
  button.primary{background:var(--accent);color:var(--ground);border-color:transparent}
  button:disabled{opacity:.45;cursor:not-allowed}
  button:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}

  .opt{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border:1px solid var(--rule);
    border-radius:10px;cursor:pointer;background:var(--panel)}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .opt.bad{opacity:.62;cursor:not-allowed}
  .opt input{margin-top:4px}
  .tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.02em}
  .tag.ok{background:var(--accent-soft);color:var(--accent)}
  .tag.no{background:transparent;color:var(--bad);border:1px solid var(--bad)}

  ul.plain{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
  .kv{display:grid;grid-template-columns:132px 1fr;gap:6px 14px;font-size:14px}
  .kv .k{color:var(--muted)}

  .bar{height:7px;border-radius:99px;background:var(--rule);overflow:hidden}
  .bar>span{display:block;height:100%;background:var(--accent);width:0;transition:width .25s ease}
  @media (prefers-reduced-motion:reduce){.bar>span{transition:none}}

  pre.log{margin:0;max-height:230px;overflow:auto;background:var(--ground);border:1px solid var(--rule);
    border-radius:8px;padding:12px;font-size:12px;line-height:1.55;white-space:pre-wrap;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  details summary{cursor:pointer;color:var(--muted);font-size:13.5px}
  details[open] summary{margin-bottom:8px}

  .check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
  .dot{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none}
  .dot.g{background:var(--good)} .dot.w{background:var(--watch)} .dot.b{background:var(--bad)}
  .note{border-left:2px solid var(--rule);padding-left:14px;color:var(--muted);font-size:14px}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <p class="eyebrow">Apple Silicon repacker for HP Click</p>
      <h1>ClickGraft</h1>
    </div>
    <div class="steps" id="pips"></div>
  </header>

  <main id="view"></main>

  <p class="small muted" id="foot"></p>
</div>

<script>
const TOKEN = "__TOKEN__";
const api = async (path, body) => {
  const r = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: {"X-ClickGraft-Token": TOKEN, "Content-Type": "application/json"},
    body: body ? JSON.stringify(body) : undefined,
  });
  return r.json();
};
const el = (h) => { const d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstChild; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let STEP = 1, ENV = null, CANDS = [], PICK = null, PLAN = null;
const STEPS = ["Check", "Choose", "Review", "Build", "Done"];

function pips() {
  document.getElementById("pips").innerHTML = STEPS
    .map((s, i) => `<span class="pip ${i + 1 === STEP ? "on" : ""}">${i + 1}. ${s}</span>`).join("");
}
function foot(t) { document.getElementById("foot").textContent = t || ""; }
function show(node) {
  const v = document.getElementById("view");
  v.innerHTML = ""; v.appendChild(node); pips();
}

/* 1 — requirements ----------------------------------------------------- */
async function stepCheck() {
  STEP = 1;
  const d = await api("/api/env");
  ENV = d.env; CANDS = d.candidates;
  const ok = ENV.clt;
  const tools = Object.entries(ENV.tools)
    .map(([t, p]) => `<div class="kv"><span class="k mono">${t}</span><span class="mono">${p ? esc(p) : "not found"}</span></div>`).join("");

  show(el(`<section class="card">
    <div><h2>Requirements</h2>
      <p class="muted small">ClickGraft needs one thing: Apple's Xcode Command Line Tools.
      It supplies the signing tools and the Python this wizard runs on.</p></div>
    <div class="check"><span class="dot ${ok ? "g" : "b"}"></span>
      <div><strong>Xcode Command Line Tools — ${ok ? "installed" : "missing"}</strong>
      ${ok ? "" : `<p class="muted small">Install them, then this check clears itself.</p>`}</div></div>
    ${ok ? "" : `<div class="row"><button class="primary" id="clt">Install Command Line Tools</button></div>`}
    <details><summary>Show technical detail</summary>${tools}
      <p class="small muted" style="margin-top:8px">Supported versions:
      ${ENV.versions.map(esc).join(", ") || "none loaded"}</p></details>
    <div class="spread"><span></span>
      <button class="primary" id="next" ${ok ? "" : "disabled"}>Continue</button></div>
  </section>`));

  const clt = document.getElementById("clt");
  if (clt) clt.onclick = async () => {
    clt.disabled = true; clt.textContent = "Apple's installer is open…";
    await api("/api/install-clt", {});
    const poll = setInterval(async () => {
      const e = await api("/api/env");
      if (e.env.clt) { clearInterval(poll); stepCheck(); }
    }, 4000);
  };
  document.getElementById("next").onclick = stepChoose;
  foot(ENV.log_path ? "Log: " + ENV.log_path : "");
}

/* 2 — choose source ----------------------------------------------------- */
function stepChoose() {
  STEP = 2;
  const items = CANDS.length ? CANDS.map((c, i) => `
    <label class="opt ${c.usable ? "" : "bad"}" data-i="${i}">
      <input type="radio" name="src" ${c.usable ? "" : "disabled"}>
      <div style="flex:1">
        <div class="row" style="gap:8px">
          <strong>${esc(c.path.split("/").pop())}</strong>
          <span class="tag ${c.usable ? "ok" : "no"}">${c.usable ? esc(c.version) : "unsupported"}</span>
        </div>
        <p class="muted small">${esc(c.archs.join(" / ") || "unknown")} · <span class="mono">${esc(c.sha256.slice(0, 24))}…</span></p>
        ${c.why ? `<p class="small" style="color:var(--watch)">${esc(c.why)}</p>` : ""}
      </div></label>`).join("")
    : `<p class="muted">No HP Click installation found in /Applications.</p>`;

  show(el(`<section class="card">
    <div><h2>Choose your HP Click</h2>
      <p class="muted small">Pick your original installation. ClickGraft never modifies it —
      it writes a separate copy.</p></div>
    ${items}
    <div id="unsupported" class="hide">
      <p class="small muted">An unsupported version can still be reported so it can be added.</p>
      <button id="probe">Generate compatibility report</button>
      <pre class="log hide" id="report"></pre>
    </div>
    <div class="spread"><button id="back">Back</button>
      <button class="primary" id="next" disabled>Continue</button></div>
  </section>`));

  document.querySelectorAll(".opt").forEach(o => o.onclick = () => {
    const c = CANDS[+o.dataset.i];
    if (!c.usable) return;
    document.querySelectorAll(".opt").forEach(x => x.classList.remove("sel"));
    o.classList.add("sel"); o.querySelector("input").checked = true;
    PICK = c; document.getElementById("next").disabled = false;
  });
  if (CANDS.some(c => !c.usable)) document.getElementById("unsupported").classList.remove("hide");
  const pb = document.getElementById("probe");
  if (pb) pb.onclick = async () => {
    pb.disabled = true; pb.textContent = "Scanning…";
    const bad = CANDS.find(c => !c.usable) || CANDS[0];
    const r = await api("/api/probe", {source: bad.path});
    const box = document.getElementById("report");
    box.classList.remove("hide"); box.textContent = r.report || r.error || "no output";
    pb.disabled = false; pb.textContent = "Generate compatibility report";
  };
  document.getElementById("back").onclick = stepCheck;
  document.getElementById("next").onclick = async () => {
    await api("/api/select", {source: PICK.path});
    stepReview();
  };
}

/* 3 — review the plan --------------------------------------------------- */
async function stepReview() {
  STEP = 3;
  PLAN = (await api("/api/plan")).plan;
  const p = PLAN;
  show(el(`<section class="card">
    <div><h2>Review the plan</h2>
      <p class="muted small">Nothing is written until you approve this.</p></div>
    <div class="kv">
      <span class="k">Read from</span><span class="mono">${esc(p.source)}</span>
      <span class="k">Written to</span><span class="mono">${esc(p.output)}</span>
      <span class="k">Version</span><span>HP Click ${esc(p.app_version)}</span>
      <span class="k">Runtime</span><span>Electron ${esc(p.electron)} (arm64)</span>
    </div>
    <div><h2 style="font-size:14px">Changes to the copy</h2>
      <ul class="plain small">${p.patches.map(x =>
        `<li><span class="mono">${esc(x.path)}</span><br><span class="muted">${esc(x.why.split(".")[0])}.</span></li>`).join("")}</ul></div>
    <div><h2 style="font-size:14px">Libraries added</h2>
      <ul class="plain small">${p.dylibs.map(x =>
        `<li><span class="mono">${esc(x.name)}</span>${x.preload ? " <span class=\"tag ok\">preloaded</span>" : ""}
         <br><span class="muted">${esc(x.why.split(".")[0])}.</span></li>`).join("")}</ul></div>
    <details><summary>Show what gets downloaded</summary>
      <ul class="plain small">${p.downloads.map(d =>
        `<li><strong>${esc(d.what)}</strong><br><span class="muted">${esc(d.from)} — verified by ${esc(d.checked)}</span></li>`).join("")}</ul>
    </details>
    <div class="spread"><button id="back">Back</button>
      <button class="primary" id="go">Build it</button></div>
  </section>`));
  document.getElementById("back").onclick = stepChoose;
  document.getElementById("go").onclick = async () => { await api("/api/build", {}); stepBuild(); };
}

/* 4/5 — build, verify, done --------------------------------------------- */
function stepBuild() {
  STEP = 4;
  show(el(`<section class="card">
    <div><h2 id="t">Building</h2><p class="muted small" id="m">Starting…</p></div>
    <div class="bar"><span id="b"></span></div>
    <pre class="log" id="l"></pre>
  </section>`));
  const tick = setInterval(async () => {
    const s = await api("/api/state");
    document.getElementById("b").style.width = (s.pct * 100).toFixed(1) + "%";
    document.getElementById("m").textContent = s.message || "";
    document.getElementById("t").textContent =
      s.phase === "verifying" ? "Verifying" : "Building";
    const log = document.getElementById("l");
    log.textContent = s.log.join("\n"); log.scrollTop = log.scrollHeight;
    if (s.phase === "done") { clearInterval(tick); stepDone(s); }
    if (s.phase === "error") { clearInterval(tick); stepError(s); }
  }, 700);
}

function stepDone(s) {
  STEP = 5;
  const rows = Object.entries(s.results).map(([k, v]) =>
    `<div class="check"><span class="dot g"></span><div><strong>${esc(k.replace(/_/g, " "))}</strong>
     <p class="muted small">${esc(v)}</p></div></div>`).join("");
  show(el(`<section class="card">
    <div><h2 style="color:var(--good)">Done</h2>
      <p class="muted small">Created <span class="mono">${esc(s.output)}</span></p></div>
    ${rows}
    <div class="note"><strong>The two apps can't run at the same time.</strong>
      They share settings, so opening one while the other is running makes the second quit
      silently. Quit one before opening the other.</div>
    <div class="note">To undo this, drag the new app to the Trash. Your original was never changed.</div>
    <div class="row"><button class="primary" id="rev">Show me the app</button>
      <button id="log">Open log</button><button id="quit">Quit</button></div>
  </section>`));
  document.getElementById("rev").onclick = () => api("/api/reveal", {path: s.output});
  document.getElementById("log").onclick = () => api("/api/reveal", {path: s.log_path});
  document.getElementById("quit").onclick = async () => {
    await api("/api/quit", {}); document.body.innerHTML =
      "<div class='wrap'><p class='muted'>ClickGraft has closed. You can close this tab.</p></div>";
  };
}

function stepError(s) {
  STEP = 4;
  show(el(`<section class="card">
    <div><h2 style="color:var(--bad)">It didn't finish</h2>
      <p class="small">${esc(s.error)}</p></div>
    <p class="small muted">Your original app was not modified.</p>
    <pre class="log">${esc(s.log.join("\n"))}</pre>
    <div class="row"><button id="again">Try again</button>
      <button id="log">Open log</button></div>
  </section>`));
  document.getElementById("again").onclick = stepReview;
  document.getElementById("log").onclick = () => api("/api/reveal", {path: s.log_path});
}

setInterval(() => fetch("/api/state", {headers: {"X-ClickGraft-Token": TOKEN}}), 5000);
stepCheck();
</script>
</body>
</html>
